<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NilObs Analytics</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,600..800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #edf3fa;
  --surface: #ffffff;
  --surface-2: #f3f7fc;
  --ink: #0f2138;
  --muted: #4d5f77;
  --line: #dde6f1;
  --grid: #e6edf5;
  --primary: #0b6bcb;
  --on-primary: #ffffff;
  --series-1: #2a78d6;
  --series-wash: rgba(42, 120, 214, 0.1);
  --series-hover: #1c5cab;
  --good: #0b7d64;
  --shadow: 0 1px 2px rgba(15, 33, 56, 0.06), 0 8px 24px rgba(15, 33, 56, 0.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0a1120;
    --surface: #111a2b;
    --surface-2: #17223a;
    --ink: #e8eef7;
    --muted: #a4b1c4;
    --line: #23314a;
    --grid: #1e2b42;
    --primary: #5aa2f0;
    --on-primary: #06101f;
    --series-1: #3987e5;
    --series-wash: rgba(57, 135, 229, 0.16);
    --series-hover: #86b6ef;
    --good: #3fc4a0;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a1120;
  --surface: #111a2b;
  --surface-2: #17223a;
  --ink: #e8eef7;
  --muted: #a4b1c4;
  --line: #23314a;
  --grid: #1e2b42;
  --primary: #5aa2f0;
  --on-primary: #06101f;
  --series-1: #3987e5;
  --series-wash: rgba(57, 135, 229, 0.16);
  --series-hover: #86b6ef;
  --good: #3fc4a0;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 34px; height: 34px; border-radius: 9px; }
h1 { font: 700 22px/1.1 "Archivo", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.02em; margin: 0; }
.meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn:focus-visible, input:focus-visible, select:focus-visible, th button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.tile .label { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.tile .value { font-weight: 600; font-size: 28px; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile.hero .value { font-size: 48px; }
.tile .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.grid { display: grid; gap: 12px; margin-bottom: 12px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.card h2 { font-size: 15px; font-weight: 600; margin: 0; }
.card .note { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.toggle { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12px; font-weight: 600; cursor: pointer; flex: none; }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--line); stroke-width: 1; }
.bar { fill: var(--series-1); }
.bar.dim { opacity: 0.45; }
.bar.on { fill: var(--series-hover); }
.vlabel { fill: var(--ink); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.area { fill: var(--series-wash); stroke: none; }
.dot { fill: var(--series-1); stroke: var(--surface); stroke-width: 2; }
.cross { stroke: var(--muted); stroke-width: 1; opacity: 0.5; }
.empty { color: var(--muted); font-size: 13px; padding: 28px 4px; text-align: center; }
.hbars { display: flex; flex-direction: column; gap: 9px; }
.hrow { display: grid; grid-template-columns: minmax(90px, 38%) 1fr; align-items: center; gap: 10px; border-radius: 8px; }
.hrow .name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow .track { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hrow .fill { height: 14px; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; flex: none; }
.hrow .num { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hrow .num small { color: var(--muted); font-weight: 400; }
.hrow:hover .fill, .hrow:focus-visible .fill { background: var(--series-hover); }
.hrow:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--surface); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; line-height: 1.35; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: 260px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip.on { opacity: 1; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
caption { text-align: left; color: var(--muted); font-size: 12px; padding-bottom: 6px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button[aria-sort] { color: var(--ink); }
.scroll { overflow: auto; max-width: 100%; }
.users .scroll { max-height: 70vh; border: 1px solid var(--line); border-radius: 12px; }
.who { display: flex; flex-direction: column; min-width: 160px; }
.who span { color: var(--muted); font-size: 12px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.filters input, .filters select { height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 10px; }
.filters input { flex: 1 1 220px; min-width: 0; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
.status { padding: 60px 16px; text-align: center; color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; margin-top: 18px; }
.split { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 520px) { .tile.hero .value { font-size: 40px; } .tile .value { font-size: 24px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img src="/favicon.svg" alt="">
      <div>
        <h1>NilObs Analytics</h1>
        <div class="meta" id="meta">Loading…</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="refresh" type="button">Refresh</button>
      <a class="btn primary" href="/">Open NilObs</a>
    </div>
  </header>
  <main id="main"><p class="status" role="status">Loading the numbers…</p></main>
  <p class="foot">Days are in UTC. Credit use per feature counts each account's latest 120 wallet entries. Names, emails and roles are what people gave NilObs. Chats, answers and photos are never shown here.</p>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<script>
(function () {
  "use strict"
  var DAYMS = 86400000

  /* ---------- tiny DOM helper: every piece of text goes in as text, never as HTML ---------- */
  function h(tag, attrs) {
    var el = document.createElement(tag)
    if (attrs) for (var k in attrs) {
      var v = attrs[k]
      if (v == null || v === false) continue
      if (k === "text") el.textContent = v
      else if (k === "class") el.className = v
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v)
      else el.setAttribute(k, v === true ? "" : v)
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i]
      if (c == null || c === false) continue
      if (Array.isArray(c)) c.forEach(function (x) { if (x != null && x !== false) el.appendChild(typeof x === "string" ? document.createTextNode(x) : x) })
      else el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c)
    }
    return el
  }
  var NS = "http://www.w3.org/2000/svg"
  function s(tag, attrs, text) {
    var el = document.createElementNS(NS, tag)
    for (var k in attrs) el.setAttribute(k, attrs[k])
    if (text != null) el.textContent = text
    return el
  }

  /* ---------- formatting ---------- */
  var nf = new Intl.NumberFormat("en-IN")
  function n(x) { return nf.format(Math.round(x || 0)) }
  function compact(x) {
    x = Math.round(x || 0)
    if (Math.abs(x) >= 1e7) return (x / 1e7).toFixed(1).replace(/\.0$/, "") + "Cr"
    if (Math.abs(x) >= 1e5) return (x / 1e5).toFixed(1).replace(/\.0$/, "") + "L"
    if (Math.abs(x) >= 1e3) return (x / 1e3).toFixed(1).replace(/\.0$/, "") + "K"
    return String(x)
  }
  function money(v, cur) {
    try { return new Intl.NumberFormat(cur === "INR" ? "en-IN" : "en-US", { style: "currency", currency: cur, maximumFractionDigits: cur === "INR" ? 0 : 2 }).format(v || 0) }
    catch (e) { return cur + " " + n(v) }
  }
  function moneyList(o) {
    var keys = Object.keys(o || {}).filter(function (k) { return o[k] > 0 })
    return keys.length ? keys.map(function (k) { return money(o[k], k) }).join(" + ") : "—"
  }
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
  function dayLabel(d, year) { var p = d.split("-"); return Number(p[2]) + " " + MONTHS[Number(p[1]) - 1] + (year ? " " + p[0] : "") }
  function dateOf(t) { if (!t) return "—"; var d = new Date(t); return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear() }
  function ago(t) {
    if (!t) return "—"
    var m = (Date.now() - t) / 60000
    if (m < 2) return "just now"
    if (m < 60) return Math.round(m) + " min ago"
    if (m < 60 * 24) return Math.round(m / 60) + " h ago"
    if (m < 60 * 24 * 30) return Math.round(m / 1440) + " d ago"
    return dateOf(t)
  }
  function plural(k, one, many) { return n(k) + " " + (Math.round(k) === 1 ? one : many || one + "s") }
  var PLAN = { free: "Free", watch: "Watchkeeper", command: "Command" }

  /* ---------- tooltip ---------- */
  var tip = document.getElementById("tip")
  function showTip(e, lines) {
    tip.textContent = ""
    lines.forEach(function (l, i) { tip.appendChild(i === 0 ? h("b", { text: l }) : document.createTextNode(l)); if (i < lines.length - 1) tip.appendChild(h("br")) })
    tip.classList.add("on")
    var x = (e.clientX != null ? e.clientX : e.x) + 14, y = (e.clientY != null ? e.clientY : e.y) + 14
    var r = tip.getBoundingClientRect()
    if (x + r.width > innerWidth - 8) x = Math.max(8, x - r.width - 28)
    if (y + r.height > innerHeight - 8) y = Math.max(8, y - r.height - 28)
    tip.style.left = x + "px"
    tip.style.top = y + "px"
  }
  function hideTip() { tip.classList.remove("on") }
  function anchorOf(el) { var r = el.getBoundingClientRect(); return { clientX: r.left + r.width / 2, clientY: r.top } }

  /* ---------- scales ---------- */
  function niceStep(max, count) {
    var raw = Math.max(max, 1) / count
    var p = Math.pow(10, Math.floor(Math.log10(raw)))
    var f = raw / p
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p
  }
  function ticksFor(max) {
    var step = Math.max(1, niceStep(max, 4))
    var top = Math.max(step, Math.ceil(max / step) * step)
    var t = []
    for (var v = 0; v <= top + 1e-9; v += step) t.push(v)
    return { top: top, ticks: t }
  }
  function roundedTop(x, y, w, hgt) {
    var r = Math.min(4, w / 2, hgt)
    return "M" + x + "," + (y + hgt) + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y + "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) + "V" + (y + hgt) + "Z"
  }

  /* ---------- charts ---------- */
  // Columns over days: one series, value of the tallest column labelled, a tooltip on every column.
  function columns(el, pts, o) {
    var W = Math.max(280, el.clientWidth || 600), H = 210, m = { l: 38, r: 8, t: 18, b: 24 }
    var iw = W - m.l - m.r, ih = H - m.t - m.b
    var max = Math.max.apply(null, pts.map(function (p) { return p.value }).concat([0]))
    var sc = ticksFor(max)
    var svg = s("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": o.aria })
    var ax = s("g", { class: "axis" })
    sc.ticks.forEach(function (t) {
      var y = m.t + ih - (t / sc.top) * ih
      if (t > 0) svg.appendChild(s("line", { class: "gridline", x1: m.l, x2: W - m.r, y1: y, y2: y }))
      ax.appendChild(s("text", { x: m.l - 6, y: y + 4, "text-anchor": "end" }, o.tick ? o.tick(t) : compact(t)))
    })
    svg.appendChild(s("line", { class: "baseline", x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih }))
    var band = iw / pts.length, bw = Math.max(2, Math.min(24, band - 2))
    var bars = []
    var maxI = -1
    pts.forEach(function (p, i) { if (p.value > 0 && (maxI < 0 || p.value >= pts[maxI].value)) maxI = i })
    pts.forEach(function (p, i) {
      var x = m.l + i * band + (band - bw) / 2
      var hh = (p.value / sc.top) * ih
      var bar = hh > 0 ? s("path", { class: "bar", d: roundedTop(x, m.t + ih - hh, bw, hh) }) : null
      if (bar) svg.appendChild(bar)
      bars.push(bar)
      if (i === 0 || i === pts.length - 1 || (i % 7 === 0 && i < pts.length - 4)) {
        var anchor = i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"
        ax.appendChild(s("text", { x: i === 0 ? m.l : i === pts.length - 1 ? W - m.r : x + bw / 2, y: H - 6, "text-anchor": anchor }, dayLabel(p.label)))
      }
      if (i === maxI) {
        var nearEnd = x + bw / 2 > W - m.r - 40, nearStart = x + bw / 2 < m.l + 40
        svg.appendChild(s("text", { class: "vlabel", x: nearEnd ? x + bw : nearStart ? x : x + bw / 2, y: m.t + ih - hh - 6, "text-anchor": nearEnd ? "end" : nearStart ? "start" : "middle" }, o.fmt(p.value)))
      }
    })
    svg.appendChild(ax)
    // hit targets: the whole column band, taller than the mark
    pts.forEach(function (p, i) {
      var hit = s("rect", { x: m.l + i * band, y: m.t, width: band, height: ih, fill: "transparent", tabindex: "0", "aria-label": dayLabel(p.label, true) + ": " + o.fmt(p.value) })
      function on(e) { bars.forEach(function (b, j) { if (b) b.setAttribute("class", "bar" + (j === i ? " on" : " dim")) }); showTip(e, [dayLabel(p.label, true), o.fmt(p.value)]) }
      function off() { bars.forEach(function (b) { if (b) b.setAttribute("class", "bar") }); hideTip() }
      hit.addEventListener("mousemove", on)
      hit.addEventListener("mouseleave", off)
      hit.addEventListener("focus", function () { on(anchorOf(hit)) })
      hit.addEventListener("blur", off)
      svg.appendChild(hit)
    })
    el.appendChild(svg)
  }

  // A line over days: 2px line, a light wash, the last value labelled at its end, crosshair + tooltip.
  function line(el, pts, o) {
    var W = Math.max(280, el.clientWidth || 600), H = 210, m = { l: 38, r: 64, t: 18, b: 24 }
    var iw = W - m.l - m.r, ih = H - m.t - m.b
    var max = Math.max.apply(null, pts.map(function (p) { return p.value }).concat([0]))
    var sc = ticksFor(max)
    var X = function (i) { return m.l + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw) }
    var Y = function (v) { return m.t + ih - (v / sc.top) * ih }
    var svg = s("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": o.aria })
    var ax = s("g", { class: "axis" })
    sc.ticks.forEach(function (t) {
      if (t > 0) svg.appendChild(s("line", { class: "gridline", x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t) }))
      ax.appendChild(s("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end" }, compact(t)))
    })
    svg.appendChild(s("line", { class: "baseline", x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih }))
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(p.value).toFixed(1) }).join("")
    svg.appendChild(s("path", { class: "area", d: d + "L" + X(pts.length - 1) + "," + (m.t + ih) + "L" + X(0) + "," + (m.t + ih) + "Z" }))
    svg.appendChild(s("path", { class: "line", d: d }))
    pts.forEach(function (p, i) {
      if (i === 0 || i === pts.length - 1 || (i % 7 === 0 && i < pts.length - 4))
        ax.appendChild(s("text", { x: X(i), y: H - 6, "text-anchor": i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle" }, dayLabel(p.label)))
    })
    svg.appendChild(ax)
    var last = pts[pts.length - 1]
    svg.appendChild(s("circle", { class: "dot", cx: X(pts.length - 1), cy: Y(last.value), r: 4 }))
    svg.appendChild(s("text", { class: "vlabel", x: X(pts.length - 1) + 8, y: Y(last.value) + 4 }, o.fmt(last.value)))
    var cross = s("line", { class: "cross", x1: 0, x2: 0, y1: m.t, y2: m.t + ih, visibility: "hidden" })
    var hov = s("circle", { class: "dot", r: 5, visibility: "hidden" })
    svg.appendChild(cross)
    svg.appendChild(hov)
    var hit = s("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent", tabindex: "0", "aria-label": o.aria })
    var cur = pts.length - 1
    function at(i, e) {
      cur = Math.max(0, Math.min(pts.length - 1, i))
      var p = pts[cur]
      cross.setAttribute("x1", X(cur)); cross.setAttribute("x2", X(cur)); cross.setAttribute("visibility", "visible")
      hov.setAttribute("cx", X(cur)); hov.setAttribute("cy", Y(p.value)); hov.setAttribute("visibility", "visible")
      var r = svg.getBoundingClientRect()
      showTip(e || { clientX: r.left + (X(cur) / W) * r.width, clientY: r.top + (Y(p.value) / H) * r.height }, [dayLabel(p.label, true), o.fmt(p.value)])
    }
    hit.addEventListener("mousemove", function (e) {
      var r = svg.getBoundingClientRect()
      var x = ((e.clientX - r.left) / r.width) * W
      at(Math.round(((x - m.l) / iw) * (pts.length - 1)), e)
    })
    function off() { cross.setAttribute("visibility", "hidden"); hov.setAttribute("visibility", "hidden"); hideTip() }
    hit.addEventListener("mouseleave", off)
    hit.addEventListener("blur", off)
    hit.addEventListener("focus", function () { at(cur) })
    hit.addEventListener("keydown", function (e) { if (e.key === "ArrowLeft") { at(cur - 1); e.preventDefault() } if (e.key === "ArrowRight") { at(cur + 1); e.preventDefault() } })
    svg.appendChild(hit)
    el.appendChild(svg)
  }

    return c
  }

  /* ---------- loading ---------- */
  function load() {
    var btn = document.getElementById("refresh")
    btn.disabled = true
    btn.textContent = "Refreshing…"
    fetch("/api/admin/stats", { credentials: "same-origin", cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status === 404 ? "This page is only for NilObs admins. Sign in on nilobs.com with the admin Google account, then reload." : "The server said " + r.status + "."); return r.json() })
      .then(render)
      .catch(function (e) { main.textContent = ""; main.appendChild(h("p", { class: "status", role: "alert", text: "Couldn't load the numbers. " + e.message })) })
      .then(function () { btn.disabled = false; btn.textContent = "Refresh" })
  }
  document.getElementById("refresh").addEventListener("click", load)
  var t
  addEventListener("resize", function () { clearTimeout(t); t = setTimeout(function () { redraws.forEach(function (f) { f() }) }, 150) })
  load()
})()
</script>
</body>
</html>
