# Unpacks nilobs-bundle.zip (uploaded through the GitHub website) into the repo, then removes the zip.
name: Unpack bundle
on:
  push:
    branches: [main]
    paths: ["nilobs-bundle.zip"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          if [ ! -f nilobs-bundle.zip ]; then echo "Nothing to unpack"; exit 0; fi
          unzip -o nilobs-bundle.zip -d .
          rm nilobs-bundle.zip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack NilObs bundle" || echo "No changes"
          git push
